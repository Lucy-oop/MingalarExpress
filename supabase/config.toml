# Minimal Supabase CLI config.
#
# This project's migrations were originally applied with psql (see
# scripts/db-push.sh), so no config.toml existed. It is added here for one
# reason: `supabase db push --include-seed` only runs a seed that the config
# declares, and the remote is fully migrated but unseeded.
#
# Ports match the local stack that is already running, so `supabase start` keeps
# behaving as it does today.
project_id = "mingalar"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
major_version = 17

# NOT idempotent: the service_areas inserts carry no ON CONFLICT clause, so a
# second run duplicates every ward and township. Run it against an empty
# service_areas table only.
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
